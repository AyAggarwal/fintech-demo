services:
  postgres:
    image: postgres:16-alpine
    container_name: fintech-demo-postgres
    environment:
      POSTGRES_USER: fintech
      POSTGRES_PASSWORD: fintech
      POSTGRES_DB: fintech_demo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fintech -d fintech_demo"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
